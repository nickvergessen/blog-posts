---
layout: frontpage
title: Blog posts
rss: feed.rss
---

    {% for post in collections.posts reversed %}
        <h2><a href="{{ post.url }}">{{ post.data.title }}</a><br><small>{{ post.date | date: "%B %e, %Y" }}</small></h2>


        <p>{{ post.content | excerpt }}</p>

        <a href="{{ post.url }}">Read more …</a>

        <br><br><hr>
    {% endfor %}
