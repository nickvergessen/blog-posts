---
layout: frontpage
title: ls ~/blog-posts
pageTitle: nickvergessen:~/blog-posts$
rss: feed.rss
---

<ul class="listing">
    {% for post in collections.posts reversed %}
    <li>
        <time datetime="{{ post.date | date: "%Y-%m-%d" }}">{{ post.date | date: "%Y-%m-%d" }}</time>
        <div>
            <a class="title" href="{{ post.url }}">{{ post.data.title }}</a>
            <div class="excerpt">{{ post.content | excerpt }}</div>
        </div>
    </li>
    {% endfor %}
</ul>
